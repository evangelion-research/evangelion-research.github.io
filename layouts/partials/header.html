<header class="site-header">
  <nav class="site-shell site-nav" aria-label="Primary navigation">
    <a class="site-mark" href="{{ "/" | relURL }}" aria-label="Repurtum Research Lab home">
      {{ with resources.Get "repurtum_logo.png" }}
        <img src="{{ .RelPermalink }}" width="34" height="34" alt="">
      {{ end }}
      <span>Repurtum</span>
    </a>
    <div class="site-links">
      {{ $current := . }}
      {{ range site.Menus.main }}
        {{ $active := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}
        <a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </div>
  </nav>
</header>
