{{ define "main" -}}
<div class="post">
  {{ with .Params.subtitle }}<p class="lead">{{ . }}</p>{{ end }}
  {{ .Content }}
</div>

{{ range slice "/notes" -}}
  {{ with $.Site.GetPage . -}}
  <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  {{ partial "page-list.html" .Pages }}
  {{- end }}
{{- end }}
{{- end }}
