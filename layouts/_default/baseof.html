<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}" data-theme="dark">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ if .IsHome }}is-home{{ else }}is-page{{ end }}">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="field-grid" aria-hidden="true"></div>
    {{ partial "header.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "scripts.html" . }}
  </body>
</html>
