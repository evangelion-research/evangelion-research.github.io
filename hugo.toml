baseURL = "https://evangelion-research.github.io/"
locale = "en-US"
title = "Evangelion Research"

enableRobotsTXT = true
enableGitInfo = false
summaryLength = 34

[params]
  description = "An interpretability lab studying mechanistic interpretability through formal reasoning and programming languages research."
  kicker = "Evangelion Research"
  tagline = "Mechanistic interpretability through formal reasoning."
  motto = "A network is a program. Read it like one."
  footer = "Evangelion Research — interpretability, formal reasoning, programming languages."
  email = "contact@evangelion-research.org"
  github = "https://github.com/evangelion-research"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[permalinks]
  notes = "/notes/:slug/"
  research = "/research/:slug/"

[taxonomies]
  tag = "tags"

[menu]
  [[menu.main]]
    name = "Research"
    pageRef = "/research"
    weight = 10
  [[menu.main]]
    name = "Notes"
    pageRef = "/notes"
    weight = 20
  [[menu.main]]
    name = "Papers"
    pageRef = "/papers"
    weight = 30
  [[menu.main]]
    name = "Lab"
    pageRef = "/lab"
    weight = 40
