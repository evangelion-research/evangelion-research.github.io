items:
  - title: "Circuits as Programs: A Denotational Account of Induction Heads"
    authors: "Evangelion Research"
    year: 2026
    venue: "Preprint"
    kind: "draft"
    abstract: >-
      We give a denotational semantics for a fragment of attention-only transformers
      in which induction heads are first-class combinators, and show that circuit
      discovery is the search for a program in that fragment agreeing with the model
      up to a bounded error relation.
    links:
      - label: "PDF"
        url: "#"
      - label: "Code"
        url: "#"

  - title: "Refinement Types for Feature Dictionaries"
    authors: "Evangelion Research"
    year: 2026
    venue: "Preprint"
    kind: "draft"
    abstract: >-
      Sparse autoencoder features are treated as refinement types over activation
      space. Subtyping gives feature hierarchy, and the typing judgement gives a
      checkable statement of what a feature is claimed to mean.
    links:
      - label: "PDF"
        url: "#"

  - title: "Proof-Carrying Interpretations"
    authors: "Evangelion Research"
    year: 2025
    venue: "Workshop"
    kind: "note"
    abstract: >-
      An interpretability claim should ship with a certificate. We propose a small
      proof language whose derivations are checkable against a model's weights and a
      finite set of activations, so that a false explanation fails to typecheck.
    links:
      - label: "PDF"
        url: "#"
      - label: "Slides"
        url: "#"

  - title: "Abstract Interpretation of Residual Streams"
    authors: "Evangelion Research"
    year: 2025
    venue: "Preprint"
    kind: "draft"
    abstract: >-
      A Galois connection between activation vectors and symbolic descriptions makes
      ablation studies sound by construction: the abstract transformer over-approximates
      the layer, so an ablated circuit's behaviour is bounded rather than guessed.
    links:
      - label: "PDF"
        url: "#"
